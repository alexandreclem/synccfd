[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synccfd"
version = "0.1.0"
description = "Synthetic credit card transaction & fraud data simulator"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Alexandre Clem", email = "alexandreclem.santos@gmail.com" },
]
keywords = [
    "synthetic-data",
    "fraud-detection",
    "credit-card",
    "simulator",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.19.0",
    "pandas>=1.2.0",
    "tqdm>=4.50.0",
    "geopandas>=0.9.0",
    "geopy>=2.2.0",
    "shapely>=2.0.0",
    "haversine>=2.3.0",
    "pyarrow>=14.0.0",
]

[project.urls]
Homepage = "https://github.com/alexandreclem/synccfd"
Repository = "https://github.com/alexandreclem/synccfd"
Documentation = "https://synccfd.readthedocs.io/"
"Bug Tracker" = "https://github.com/alexandreclem/synccfd/issues"

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "scipy>=1.7.0",
]
docs = [
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.18.0",
    "myst-parser>=0.18.0",
]
examples = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "jupyter>=1.0.0",
    "notebook>=6.4.0",
    "dataframe-image>=0.1.0",
    "ipykernel>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synccfd"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["examples", "docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -m \"not slow\""
testpaths = ["tests"]
markers = [
    "slow: long-running end-to-end tests, excluded by default (run with -m slow)",
]
