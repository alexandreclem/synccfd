name: CI

on:
  push:
    branches: [ master, "feat/**" ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) no longer ships Python 3.9
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Lint (ruff)
      run: |
        ruff check .
        ruff format --check .

    - name: Type check (mypy)
      run: mypy src

    - name: Run tests
      run: pytest --cov=synccfd --cov-report=xml

    - name: Upload coverage
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  slow-tests:
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) no longer ships Python 3.9

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run slow tests
      run: pytest -m slow
